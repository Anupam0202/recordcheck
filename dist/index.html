</style></head><body><div id="app"></div><noscript>This local prototype requires JavaScript. It does not call an AI service or send matter text to a server.</noscript><script>(()=>{
"use strict";
                                                                   
                                                                                                                                              
                                                                                                                                                       
                                                       
                                                                                                                                                           
                                                                                                                                                  
                                                                                         
const LIMITS = { bytes: 204800, documents: 12, claims: 30, sourceChars: 100000, docChars: 30000, lines: 1000, claimChars: 1500, quoteChars: 1200 }         ;
const isObj = (v         )                               => typeof v === 'object' && v !== null && !Array.isArray(v);
function obj(v         , name        , keys          )                          {
  if (!isObj(v)) throw new Error(`${name} must be an object.`);
  if (Object.keys(v).some(k => !keys.includes(k))) throw new Error(`${name} contains unsupported fields. Import working-matter JSON, not a review report.`);
  return v;
}
function str(v         , name        , max        , empty = false)         {
  if (typeof v !== 'string' || (!empty && !v.trim()) || v.length > max || /\u0000/.test(v)) throw new Error(`${name} must be ${empty ? 'text' : 'nonempty text'} of at most ${max} characters.`);
  return v;
}
function id(v         , name        )         {
  const s = str(v, name, 40); if (!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(s)) throw new Error(`${name} must use letters, numbers, hyphens or underscores.`); return s;
}
function lines(text        )           { return text.replace(/\r\n?/g, '\n').split('\n'); }
function validateMatter(input         )         {
  const m = obj(input, 'Matter', ['schemaVersion','id','title','jurisdiction','synthetic','documents','claims']);
  if (m.schemaVersion !== 1 || typeof m.synthetic !== 'boolean') throw new Error('Expected schemaVersion 1 and a synthetic boolean.');
  if (!Array.isArray(m.documents) || m.documents.length > LIMITS.documents) throw new Error('Use at most 12 documents.');
  if (!Array.isArray(m.claims) || m.claims.length > LIMITS.claims) throw new Error('Use at most 30 claims.');
  const documents             = m.documents.map((v, i) => {
    const d = obj(v, `Document ${i+1}`, ['id','title','text']);
    const text = str(d.text, 'Document text', LIMITS.docChars, true);
    if (lines(text).length > LIMITS.lines) throw new Error('Use at most 1,000 lines per document.');
    return { id: id(d.id, 'Document ID'), title: str(d.title, 'Document title', 160), text };
  });
  if (documents.reduce((n,d) => n+d.text.length,0) > LIMITS.sourceChars) throw new Error('Source text exceeds 100,000 characters.');
  const claims          = m.claims.map((v,i) => {
    const c = obj(v, `Claim ${i+1}`, ['id','text','kind','sourceId','lineStart','lineEnd','quote']);
    if (c.kind !== 'fact' && c.kind !== 'legal') throw new Error('Claim kind must be fact or legal.');
    if (!Number.isSafeInteger(c.lineStart) || !Number.isSafeInteger(c.lineEnd) || (c.lineStart          )<1 || (c.lineEnd          )<(c.lineStart          ) || (c.lineEnd          )>LIMITS.lines || (c.lineEnd          )-(c.lineStart          )>30) throw new Error('Claim line ranges must be 1–1,000, ascending, and at most 31 lines.');
    const sourceId = str(c.sourceId, 'Source ID', 40, true);
    if (sourceId && !/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(sourceId)) throw new Error('Invalid source ID.');
    return { id:id(c.id,'Claim ID'), text:str(c.text,'Claim text',LIMITS.claimChars), kind:c.kind, sourceId, lineStart:c.lineStart          , lineEnd:c.lineEnd          , quote:str(c.quote,'Quote',LIMITS.quoteChars,true) };
  });
  for (const [name,rows] of [['document',documents],['claim',claims]]         ) if (new Set(rows.map(r=>r.id)).size !== rows.length) throw new Error(`Duplicate ${name} IDs are not allowed.`);
  return { schemaVersion:1, id:id(m.id,'Matter ID'), title:str(m.title,'Matter title',160), jurisdiction:str(m.jurisdiction,'Jurisdiction',100), synthetic:m.synthetic, documents, claims };
}
function parseMatter(text        )         {
  if (new TextEncoder().encode(text).byteLength > LIMITS.bytes) throw new Error('JSON exceeds the 200 KiB file limit.');
  let parsed         ; try { parsed=JSON.parse(text); } catch { throw new Error('Invalid JSON. Load the sample or fix the JSON syntax.'); }
  return validateMatter(parsed);
}
function normalize(s        )         { return s.replace(/\s+/g,' ').trim(); }
async function sha256(s        )                  {
  if (!globalThis.crypto?.subtle) throw new Error('Secure local hashing is unavailable. Open on localhost or HTTPS; no analysis was approved.');
  return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function dates(s        )           { return [...new Set(s.match(/\b\d{4}-\d{2}-\d{2}\b/g)||[])]; }
function amounts(s        )           {
  return [...new Set((s.match(/(?:SGD\s*|S\$\s*)\d+(?:,\d{3})*(?:\.\d{1,2})?(?!\d|,\d|\.\d)/gi)||[]).map(v=>'SGD '+v.replace(/^(SGD\s*|S\$\s*)/i,'').replace(/,/g,'')))];
}
async function analyzeClaim(matter        , c       )                    {
  const d = matter.documents.find(d=>d.id===c.sourceId);
  const sourceHash = d ? await sha256(JSON.stringify(d)) : null;
  const fingerprint = await sha256(JSON.stringify({matterId:matter.id,title:matter.title,jurisdiction:matter.jurisdiction,synthetic:matter.synthetic,claim:c,document:d??null}));
  const signals           = [];
  const add=(code       ,message       )=>signals.push({code,message});
  let passage='';
  if (!c.sourceId) add('MISSING_CITATION','No exhibit has been cited. Select a source and exact lines.');
  else if (!d) add('MISSING_SOURCE',`Cited exhibit ${c.sourceId} is not in this matter.`);
  else {
    const ls=lines(d.text);
    if (c.lineEnd>ls.length || !d.text.trim()) add('MISSING_LINES',`The cited range is not available in ${d.id}.`);
    else {
      passage=ls.slice(c.lineStart-1,c.lineEnd).join('\n');
      if (!passage.trim()) add('EMPTY_PASSAGE','The cited lines contain no text.');
      if (c.quote && !normalize(passage).includes(normalize(c.quote))) add('QUOTE_MISMATCH','The supplied quote does not occur in the cited lines (whitespace-normalized, case-sensitive).');
      const unsupportedDates=dates(c.text).filter(v=>!dates(passage).includes(v));
      const unsupportedAmounts=amounts(c.text).filter(v=>!amounts(passage).includes(v));
      if (unsupportedDates.length) add('DATE_NOT_IN_PASSAGE',`Draft date(s) not found in the cited lines: ${unsupportedDates.join(', ')}. This is a literal check, not a finding that the date is wrong.`);
      if (unsupportedAmounts.length) add('AMOUNT_NOT_IN_PASSAGE',`Draft amount(s) not found in the cited lines: ${unsupportedAmounts.join(', ')}. Source amounts: ${amounts(passage).join(', ')||'none recognized'}. No arithmetic or currency inference was performed.`);
      if (/ignore\s+(all\s+)?(previous|prior)\s+instructions|reveal\s+(the\s+)?(api\s*)?key|system\s*prompt/i.test(passage)) add('UNTRUSTED_INSTRUCTIONS','The passage contains instruction-like text. It was treated only as evidence text, never executed. Human review is required.');
    }
  }
  if (c.kind==='legal') add('LEGAL_ABSTENTION','Legal proposition: this tool cannot verify authority, applicability or legal support. Use primary legal sources and qualified review outside this tool.');
  return {claimId:c.id,fingerprint,sourceHash,passage,signals,mechanicallyClear:signals.length===0};
}
async function analyzeMatter(matter        , signal              )                      {
  validateMatter(matter);
  const result            =[];
  for (const c of matter.claims) {
    if (signal?.aborted) throw new Error('Review cancelled.');
    result.push(await analyzeClaim(matter,c));
  }
  if (signal?.aborted) throw new Error('Review cancelled.');
  return result;
}
function stateFor(a          , r         )              {
  if (r && r.fingerprint!==a.fingerprint) return 'stale';
  if (r?.disposition==='excluded') return 'excluded';
  if (r?.disposition==='reviewed' && a.mechanicallyClear) return 'reviewed';
  return a.mechanicallyClear ? 'needs-review':'blocked';
}
function makeReview(a          , disposition                       , reviewer        , reason        , acknowledged         , at = new Date().toISOString())         {
  if (!acknowledged) throw new Error('Confirm you inspected the source and understand the scope.');
  if (disposition!=='reviewed' && disposition!=='excluded') throw new Error('Invalid review disposition.');
  if (disposition==='reviewed'&&!a.mechanicallyClear) throw new Error('Resolve mechanical issues before reviewing, or explicitly exclude this claim.');
  str(reviewer,'Reviewer label',100); str(reason,'Review reason',800);
  if (reason.trim().length<12) throw new Error('Record a meaningful reason of at least 12 characters.');
  if (Number.isNaN(Date.parse(at))) throw new Error('Invalid review timestamp.');
  return {claimId:a.claimId,fingerprint:a.fingerprint,disposition,reviewer:reviewer.trim(),reason:reason.trim(),at};
}
function summarize(analyses            , reviews                       ) {
  const counts                            ={blocked:0,'needs-review':0,reviewed:0,excluded:0,stale:0};
  for (const a of analyses) counts[stateFor(a,Object.hasOwn(reviews,a.claimId)?reviews[a.claimId]:undefined)]++;
  return {...counts,total:analyses.length,unresolved:counts.blocked+counts['needs-review']+counts.stale,allDisposed:analyses.length>0&&counts.blocked+counts['needs-review']+counts.stale===0};
}
function report(matter        , analyses            , reviews                       )         {
  const s=summarize(analyses,reviews);
  const safe=(s       )=>s.replace(/[\r\n]/g,' ').replace(/[\[\]<>`]/g,'');
  const content=[`# RecordCheck review packet — ${safe(matter.title)}`,`\n${matter.synthetic?'SYNTHETIC DEMONSTRATION — NOT REAL EVIDENCE':'USER-SUPPLIED MATERIAL — NOT AUTHENTICATED'}`,`\nJurisdiction label: ${safe(matter.jurisdiction)}. Not legal advice or a filing/compliance certificate.`, `\n${s.unresolved} unresolved of ${s.total}. Reviewed: ${s.reviewed}. Excluded: ${s.excluded}.`, '\nLocal, self-attested review records only: not authenticated identities, signatures or tamperproof audit evidence. A quote match does NOT establish factual/semantic support. Dates/amounts are literal checks only.'];
  for (const a of analyses) {
    const c=matter.claims.find(c=>c.id===a.claimId) ; const r=Object.hasOwn(reviews,a.claimId)?reviews[a.claimId]:undefined;
    content.push(`\n## ${c.id} — ${stateFor(a,r).toUpperCase()}`,safe(c.text),`Source: ${c.sourceId||'NONE'}, lines ${c.lineStart}–${c.lineEnd}.`,`Fingerprint: ${a.fingerprint}`,`Source SHA-256: ${a.sourceHash||'MISSING'}`);
    if (a.passage) content.push('Cited passage (plain text; untrusted):',...lines(a.passage).map(l=>'    '+l));
    for (const issue of a.signals) content.push(`- ${issue.code}: ${safe(issue.message)}`);
    if (r) content.push(`Self-attested ${safe(r.disposition)} by ${safe(r.reviewer)} at ${r.at}. Reason: ${safe(r.reason)}. ${r.fingerprint===a.fingerprint?'Revision matches.':'STALE — earlier revision, not current approval.'}`);
    else content.push('Human disposition: NOT RECORDED.');
  }
  return content.join('\n')+'\n';
}
function demoMatter()         { return {
  schemaVersion:1,id:'demo-sg-01',title:'Meridian supply dispute',jurisdiction:'Singapore — synthetic example',synthetic:true,
  documents:[
    {id:'E1',title:'Purchase order — synthetic',text:'SYNTHETIC DEMO — not a real transaction.\nPurchase order: Meridian Studio / Harbor Supplies.\nThe agreed price is SGD 8,000.\nDelivery is scheduled for 2026-08-15.\nPayment is due after delivery.'},
    {id:'E2',title:'Delivery email — synthetic',text:'SYNTHETIC DEMO — not a real email.\nFrom: Harbor Supplies (fictional).\nWe delivered the goods on 2026-08-18.\nThe customer has not confirmed acceptance.'},
    {id:'E3',title:'Account note — synthetic',text:'SYNTHETIC DEMO — not an authentic record.\nMeridian paid SGD 8,000 on 2026-08-20.\nThis note records a payment, not an admission of liability.'}
  ],
  claims:[
    {id:'C1',text:'The agreed price was SGD 18,000.',kind:'fact',sourceId:'E1',lineStart:3,lineEnd:3,quote:'The agreed price is SGD 18,000.'},
    {id:'C2',text:'The goods were delivered on 2026-08-15.',kind:'fact',sourceId:'E2',lineStart:3,lineEnd:3,quote:''},
    {id:'C3',text:'Meridian paid SGD 8,000 on 2026-08-20.',kind:'fact',sourceId:'E3',lineStart:2,lineEnd:2,quote:'Meridian paid SGD 8,000 on 2026-08-20.'},
    {id:'C4',text:'Harbor admitted liability for the delay.',kind:'fact',sourceId:'E9',lineStart:1,lineEnd:1,quote:''},
    {id:'C5',text:'These facts legally establish liability.',kind:'legal',sourceId:'E1',lineStart:3,lineEnd:5,quote:''},
    {id:'C6',text:'The customer accepted the goods.',kind:'fact',sourceId:'E2',lineStart:4,lineEnd:4,quote:'The customer has not confirmed acceptance.'}
  ]
}; }


const app=document.getElementById('app') ;
let matter       =demoMatter(), analyses           =[], reviews                      =Object.create(null), selected='C1', tab='review', busy=false, error='', notice='', activity         =[];
let controller                     =null, epoch=0;
const e=(v        )=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] ));
const labels                      ={blocked:'Issue to resolve','needs-review':'Human review needed',reviewed:'Reviewed · self-attested',excluded:'Excluded by reviewer',stale:'Review is stale'};
const stamp=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
function log(s       ){activity.unshift(`${stamp()} — ${s}`);activity=activity.slice(0,100);}
function download(name       ,body       ,type='text/plain'){const u=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function updateNotice(s       ){notice=s;render();}
function sourcePane(c      ){
 const d=matter.documents.find(d=>d.id===c.sourceId); const a=analyses.find(a=>a.claimId===c.id);
 if(!d)return `<div class="empty"><strong>No source available</strong><p>Add the missing exhibit in Matter data. The tool cannot infer missing evidence.</p></div>`;
 return `<div class="source-meta"><div><span class="eyebrow">${e(d.id)} · selected source</span><h3>${e(d.title)}</h3></div><span class="tag">Lines ${c.lineStart}–${c.lineEnd}</span></div><div class="source-lines" tabindex="0" aria-label="Source lines with cited range highlighted">${lines(d.text).map((s,i)=>`<div class="source-line ${i+1>=c.lineStart&&i+1<=c.lineEnd?'cited':''}"><span class="line-no">${i+1}</span><span>${e(s)||'&nbsp;'}</span></div>`).join('')}</div><p class="small">Highlighted lines are the citation. Read the surrounding context. Text may be incomplete, false or instruction-like; nothing here is executed.</p><details><summary>Source revision fingerprint</summary><p class="hash">${e(a?.sourceHash||'Not analyzed')}</p><p class="small">SHA-256 binds this text revision. It does not authenticate the original document.</p></details>`;
}
function render(){
 const sum=summarize(analyses,reviews); const c=matter.claims.find(c=>c.id===selected)||matter.claims[0]; const a=c?analyses.find(a=>a.claimId===c.id):undefined; const r=c?reviews[c.id]:undefined;
 app.innerHTML=`<a class="skip" href="#main">Skip to review</a><header><a class="brand" href="#" aria-label="RecordCheck home"><span class="brand-mark" aria-hidden="true">R</span><strong>RecordCheck</strong><span class="version">prototype</span></a><span class="local"><span aria-hidden="true">●</span> Local only · no AI calls</span></header><main id="main"><div class="intro"><div><p class="eyebrow">EVIDENCE REVIEW / REVISION-BOUND HANDOFF</p><h1>A citation is not a verification.</h1><p class="lede">Find mechanical gaps. Inspect the record. Keep human review tied to the exact evidence.</p></div><button id="reset" class="secondary">Reset synthetic demo</button></div><div class="banner">${matter.synthetic?'<strong>Synthetic demonstration.</strong> Fictional documents, not real legal evidence.':'<strong>User-supplied material.</strong> Not authenticated; use only data you are authorized to process.'} Official hackathon track fit is unverified. Not legal advice.</div><div class="matter-head"><div><h2>${e(matter.title)}</h2><p class="small">${e(matter.jurisdiction)} · ${matter.documents.length} exhibits · ${matter.claims.length} claims</p></div><div class="actions"><button id="export-matter" class="secondary">Save working matter</button><button id="export-report" ${busy||!analyses.length?'disabled':''}>Export review packet</button></div></div><div class="stats" aria-label="Current review status"><div><strong>${sum.blocked}</strong><span>With mechanical issues</span></div><div><strong>${sum['needs-review']}</strong><span>Awaiting human review</span></div><div><strong>${sum.stale}</strong><span>Stale after changes</span></div><div><strong>${sum.reviewed}</strong><span>Reviewed by a person</span></div></div><nav class="tabs" aria-label="Workspace sections">${[['review','Review claims'],['data','Matter data'],['activity','Review activity'],['limits','Scope & limitations']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}">${label}</button>`).join('')}</nav><div aria-live="polite" id="messages">${error?`<div role="alert" class="error">${e(error)}</div>`:''}${notice?`<div class="notice">${e(notice)}</div>`:''}${busy?'<div class="notice">Checking references and computing revision fingerprints… <button id="cancel" class="secondary">Cancel</button></div>':''}</div>
 ${tab==='review'?`<div class="workspace"><aside class="claim-list" aria-label="Claims">${matter.claims.length?matter.claims.map(cl=>{const an=analyses.find(x=>x.claimId===cl.id);const st=an?stateFor(an,reviews[cl.id]):'needs-review';return `<button class="claim-card ${cl.id===c?.id?'selected':''}" data-claim="${e(cl.id)}" aria-pressed="${cl.id===c?.id}"><span class="claim-id">${e(cl.id)} <span class="badge ${st}">${e(labels[st])}</span></span><span>${e(cl.text)}</span><span class="small">${e(cl.sourceId)||'No citation'} · lines ${cl.lineStart}–${cl.lineEnd}</span></button>`}).join(''):'<div class="empty"><h3>No claims yet</h3><p>Load the synthetic demo or import a working matter.</p></div>'}</aside><section class="review-detail" aria-label="Selected claim">${c?`<div class="panel"><div class="section-head"><span class="eyebrow">${e(c.id)} / ${e(c.kind)} claim</span><span class="badge ${a?stateFor(a,r):'needs-review'}">${e(a?labels[stateFor(a,r)]:'Not checked')}</span></div><h3>${e(c.text)}</h3>${a?.signals.length?`<ul class="signals">${a.signals.map(s=>`<li><strong>${e(s.code.replace(/_/g,' ').toLowerCase())}</strong><p>${e(s.message)}</p></li>`).join('')}</ul>`:'<div class="uncertain"><strong>No mechanical issue detected ≠ claim supported.</strong><p>Negation, context, identity, credibility and legal meaning are not checked. Read the source before deciding.</p></div>'}${r&&a?`<div class="receipt"><strong>${r.fingerprint===a.fingerprint?'Local review record':'STALE RECORD — re-review needed'}</strong><p>${e(r.reviewer)} · ${e(r.reason)}</p></div>`:''}<details><summary>Edit this draft claim or citation</summary><form id="claim-form"><label>Claim text<textarea name="text" maxlength="1500" rows="3" required>${e(c.text)}</textarea></label><div class="form-row"><label>Source ID<input name="sourceId" maxlength="40" value="${e(c.sourceId)}"></label><label>Start line<input name="lineStart" type="number" min="1" max="1000" value="${c.lineStart}" required></label><label>End line<input name="lineEnd" type="number" min="1" max="1000" value="${c.lineEnd}" required></label></div><label>Exact quote (optional)<textarea name="quote" maxlength="1200" rows="2">${e(c.quote)}</textarea></label><button ${busy?'disabled':''}>Save claim & recheck</button><p class="small">Correct only what the evidence justifies. An edit invalidates earlier review.</p></form></details></div><div class="panel evidence">${sourcePane(c)}</div><div class="panel"><h3>Record a human disposition</h3><p class="small">This is a self-attested review note, not a verified identity or digital signature. Resolve flags to mark reviewed, or explicitly exclude the claim.</p><form id="review-form"><div class="form-row"><label>Reviewer label<input name="reviewer" maxlength="100" placeholder="Your name or demo label" required></label><label>Disposition<select name="disposition"><option value="reviewed" ${!a?.mechanicallyClear?'disabled':''}>Reviewed against source</option><option value="excluded" ${!a?.mechanicallyClear?'selected':''}>Exclude from proposed handoff</option></select></label></div><label>Reason<textarea name="reason" maxlength="800" minlength="12" rows="2" placeholder="What did you inspect, and why did you reach this decision?" required></textarea></label><label class="check"><input name="ack" type="checkbox" required><span>I read the cited source and surrounding context. I understand that mechanical checks do not establish truth, legal validity or completeness.</span></label><button ${busy||!a?'disabled':''}>Record disposition</button></form></div>`:'<div class="panel empty"><h3>Start with a source and one claim.</h3><p>No completed or verified handoff can be inferred from an empty matter.</p></div>'}</section></div>`:''}
 ${tab==='data'?`<div class="data-grid"><section class="panel"><h3>Source exhibits</h3><p>Edits here invalidate reviews for claims citing the changed exhibit, including edits outside the cited lines.</p>${matter.documents.map(d=>`<details class="doc-edit"><summary>${e(d.id)} · ${e(d.title)}</summary><form data-doc="${e(d.id)}"><label>Document text<textarea name="text" rows="8" maxlength="30000">${e(d.text)}</textarea></label><button ${busy?'disabled':''}>Save source & recheck</button></form></details>`).join('')}</section><section class="panel"><h3>Import a working matter</h3><p class="small">JSON only · 200 KiB max · 12 exhibits · 30 claims. No PDFs or live model processing. Imported files never restore approvals.</p><label>Choose JSON file<input id="file" type="file" accept=".json,application/json"></label><form id="import-form"><label>Or paste working-matter JSON<textarea id="json-input" name="json" rows="12" spellcheck="false" placeholder="Use Save working matter to see the schema."></textarea></label><button ${busy?'disabled':''}>Validate & import</button></form><button id="clear" class="secondary danger">Clear this local matter</button><p class="small">All state stays in memory and is lost on refresh unless you save it. Exports contain the selected matter text. No credentials are needed or accepted.</p></section></div>`:''}
 ${tab==='activity'?`<section class="panel"><h3>Local activity</h3><p class="small">Informational session log, not a tamperproof audit trail. No analytics or remote logging.</p><ol class="activity">${activity.map(x=>`<li>${e(x)}</li>`).join('')||'<li>No activity yet.</li>'}</ol></section>`:''}
 ${tab==='limits'?`<section class="panel limits"><h3>Designed to assist review, never replace it.</h3><div class="limits-grid"><div><h4>What it checks</h4><ul><li>Source IDs and inclusive line ranges.</li><li>Exact quotes, ignoring whitespace only.</li><li>Explicit YYYY-MM-DD dates and SGD / S$ amounts appearing in cited lines.</li><li>Whether a recorded disposition matches the current matter, claim and source revision.</li></ul></div><div><h4>What it cannot establish</h4><ul><li>That an assertion follows from a quote—even a verbatim quote.</li><li>Truth, identity, negation, arithmetic, credibility or completeness.</li><li>Validity of law, deadlines, admissibility, privilege or PDPA compliance.</li><li>Authentic reviewer identity or source provenance beyond supplied text.</li></ul></div></div><div class="uncertain"><strong>Try claim C6.</strong> The source says acceptance is not confirmed. Literal checks can pass while the draft says the opposite. This must stay with a human reviewer.</div><h4>Scope and data</h4><p>Local deterministic prototype. No live Gemini, network fetching, database, PDF parser, uploads to a server or browser persistence. Instruction-like material remains inert text. Use synthetic or expressly approved material. Do not treat this as filing-ready legal software.</p><p>Official 2026 sponsor problem and eligibility are unverified. No competition submission or public deployment has been performed by this app.</p></section>`:''}
 <footer><span>RecordCheck · ${sum.unresolved} unresolved · ${sum.excluded} excluded</span><span>${sum.allDisposed?'All claims have a local disposition — not a legal approval.':'Handoff review is incomplete.'}</span></footer></main>`;
 bind();
}
function bind(){
 app.querySelector('.brand')?.addEventListener('click',ev=>{ev.preventDefault();tab='review';render();});
 app.querySelectorAll                   ('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab ;error='';notice='';render();});
 app.querySelectorAll                   ('[data-claim]').forEach(b=>b.onclick=()=>{selected=b.dataset.claim ;error='';notice='';render();if(innerWidth<=640)document.querySelector('.review-detail')?.scrollIntoView({block:'start'});});
 byId                   ('reset') .onclick=()=>{if(!confirm('Reset to the synthetic scenario? Unsaved changes and reviews will be cleared.'))return;controller?.abort();matter=demoMatter();reviews=Object.create(null);activity=[];selected='C1';log('Reset to synthetic demo.');void run();};
 byId                   ('export-matter') .onclick=()=>download('recordcheck-working-matter.json',JSON.stringify(matter,null,2),'application/json');
 byId                   ('export-report') .onclick=()=>{if(busy)return;download('recordcheck-review-packet.md',report(matter,analyses,reviews),'text/markdown');log('Exported packet including unresolved/stale claims.');updateNotice('Exported review packet. This is not legal approval; unresolved items remain visible.');};
 byId                   ('cancel')?.addEventListener('click',()=>controller?.abort());
 byId                 ('claim-form')?.addEventListener('submit',ev=>{ev.preventDefault();if(busy)return;const f=new FormData(ev.currentTarget                   );const next=structuredClone(matter);const c=next.claims.find(c=>c.id===selected) ;c.text=String(f.get('text'));c.sourceId=String(f.get('sourceId'));c.quote=String(f.get('quote'));c.lineStart=Number(f.get('lineStart'));c.lineEnd=Number(f.get('lineEnd'));try{matter=validateMatter(next);log(`Changed claim ${c.id}; prior review will be rechecked.`);void run();}catch(ex){error=(ex         ).message;render();}});
 byId                 ('review-form')?.addEventListener('submit',ev=>{ev.preventDefault();if(busy)return;const f=new FormData(ev.currentTarget                   );try{const a=analyses.find(a=>a.claimId===selected) ;reviews[selected]=makeReview(a,f.get('disposition')                         ,String(f.get('reviewer')),String(f.get('reason')),f.get('ack')==='on');log(`Recorded ${reviews[selected].disposition} for ${selected} against current revision.`);notice='Disposition recorded locally. A later relevant edit will invalidate it.';error='';render();}catch(ex){error=(ex         ).message;render();}});
 app.querySelectorAll                 ('[data-doc]').forEach(form=>form.onsubmit=ev=>{ev.preventDefault();if(busy)return;const next=structuredClone(matter);const d=next.documents.find(d=>d.id===form.dataset.doc) ;d.text=String(new FormData(form).get('text'));try{matter=validateMatter(next);log(`Changed source ${d.id}; checking for stale reviews.`);void run();}catch(ex){error=(ex         ).message;render();}});
 byId                 ('import-form')?.addEventListener('submit',ev=>{ev.preventDefault();importText(String(new FormData(ev.currentTarget                   ).get('json')));});
 byId                  ('file')?.addEventListener('change',async ev=>{const file=(ev.target                    ).files?.[0];if(!file)return;if(file.size>LIMITS.bytes){error='File exceeds 200 KiB.';render();return;}if(!file.name.toLowerCase().endsWith('.json')){error='Only .json working-matter files are supported.';render();return;}try{importText(await file.text());}catch{error='Could not read this file.';render();}});
 byId                   ('clear')?.addEventListener('click',()=>{if(!confirm('Clear this local matter and all reviews? Save first if needed.'))return;controller?.abort();matter={schemaVersion:1,id:'empty',title:'Untitled local matter',jurisdiction:'UNKNOWN',synthetic:false,documents:[],claims:[]};reviews=Object.create(null);activity=[];log('Cleared local matter.');void run();});
}
function byId                       (id       ){return document.getElementById(id)          ;}
function importText(text       ){if(busy)return;try{const next=parseMatter(text);if(!confirm('Replace the current matter? All existing local approvals will be cleared.'))return;matter=next;reviews=Object.create(null);activity=[];selected=matter.claims[0]?.id||'';log('Imported validated matter; all approvals cleared.');notice='Imported text; approvals were not imported.';void run();}catch(ex){error=(ex         ).message;render();}}
async function run(){controller?.abort();const current=++epoch;controller=new AbortController();const signal=controller.signal;busy=true;error='';analyses=[];render();try{await new Promise(r=>setTimeout(r,30));const result=await analyzeMatter(matter,signal);if(current!==epoch)return;analyses=result;log(`Checked ${analyses.length} claims. No automatic semantic verification.`);}catch(ex){if(current!==epoch)return;error=(ex         ).message;}finally{if(current===epoch){busy=false;render();}}}
log('Loaded synthetic scenario. No network or AI processing.');void run();

})();</script></body></html>
